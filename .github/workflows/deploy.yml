name: Deploy Shiny app to GitHub Pages

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Shinylive
        run: |
          python -m pip install --upgrade pip
          pip install shinylive==0.8.12

      - name: Create Shinylive app directory
        run: |
          mkdir -p shinylive_app

          cp vaccbopti/app.py shinylive_app/app.py
          cp vaccbopti/run_simulation.py shinylive_app/run_simulation.py
          cp vaccbopti/make_plots.py shinylive_app/make_plots.py

          cp -r vaccbopti/classes shinylive_app/classes
          cp -r outputs shinylive_app/outputs

          cp -r vaccbopti shinylive_app/vaccbopti

          cp vaccbopti/requirements.txt shinylive_app/requirements.txt

      - name: Export Shinylive app
        run: |
          shinylive export shinylive_app site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
